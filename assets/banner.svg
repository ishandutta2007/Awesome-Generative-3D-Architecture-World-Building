<svg width="100%" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="50%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#090a14" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pinkOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>

    <style>
      .glow-cyan {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .glow-purple {
        animation: floatOrb 10s ease-in-out infinite alternate-reverse;
      }
      .wave-wireframe {
        animation: pulseWave 6s ease-in-out infinite alternate;
      }
      .particle-pulse {
        animation: particleGlow 3s ease-in-out infinite alternate;
      }
      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -20px) scale(1.15); }
        100% { transform: translate(-30px, 15px) scale(0.95); }
      }
      @keyframes pulseWave {
        0% { opacity: 0.25; stroke-dashoffset: 0; }
        50% { opacity: 0.45; stroke-dashoffset: 20; }
        100% { opacity: 0.25; stroke-dashoffset: 40; }
      }
      @keyframes particleGlow {
        0% { opacity: 0.3; transform: scale(0.9); }
        100% { opacity: 0.8; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="280" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="280" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="glow-cyan" cx="200" cy="80" r="160" fill="url(#cyanOrb)" />
  <circle class="glow-purple" cx="1020" cy="200" r="180" fill="url(#purpleOrb)" />
  <circle class="glow-cyan" cx="900" cy="70" r="130" fill="url(#pinkOrb)" />

  <!-- Animated Isometric Spatial Grid Waves (Background Layer) -->
  <g class="wave-wireframe" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6,4">
    <path d="M 50 250 L 300 180 L 600 230 L 900 170 L 1150 240" />
    <path d="M 80 270 L 330 200 L 630 250 L 930 190 L 1180 260" stroke="#818cf8" stroke-opacity="0.35" />
    <path d="M 20 230 L 270 160 L 570 210 L 870 150 L 1120 220" stroke="#c084fc" stroke-opacity="0.25" />
  </g>

  <!-- Animated Geometric Spatial Node Particles -->
  <g fill="#38bdf8" class="particle-pulse">
    <circle cx="300" cy="180" r="3.5" />
    <circle cx="600" cy="230" r="4" fill="#818cf8" />
    <circle cx="900" cy="170" r="3.5" fill="#c084fc" />
    <circle cx="150" cy="130" r="2.5" fill="#f472b6" />
    <circle cx="1060" cy="110" r="3" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header Title & Subtitles -->
  <!-- Tagline Pill Badge -->
  <g transform="translate(420, 28)">
    <rect x="0" y="0" width="360" height="32" rx="16" fill="#131b38" stroke="url(#pillBorder)" stroke-width="1.2" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="35" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">SPATIAL AI &amp; PROCEDURAL WORLDS 2026</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="112" text-anchor="middle" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Segoe UI Emoji', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    🏙️ Generative 3D Architecture &amp; World Building
  </text>

  <!-- Subtitle -->
  <text x="600" y="148" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
    Curated Hub of Commercial 3D Foundation Suites, Open-Source Neural Meshes &amp; Procedural Simulators
  </text>

  <!-- Tech Category Feature Badges / Foreground Pills -->
  <g transform="translate(140, 182)">
    <!-- Pill 1: Procedural Worlds -->
    <g transform="translate(0, 0)">
      <rect width="200" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
      <text x="100" y="21" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🌍 Procedural Worlds</text>
    </g>

    <!-- Pill 2: Text/Image-to-3D -->
    <g transform="translate(230, 0)">
      <rect width="210" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1" />
      <text x="105" y="21" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">✨ Text &amp; Image to 3D</text>
    </g>

    <!-- Pill 3: Gaussian Splatting -->
    <g transform="translate(470, 0)">
      <rect width="210" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1" />
      <text x="105" y="21" text-anchor="middle" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🔮 3D Gaussian Splatting</text>
    </g>

    <!-- Pill 4: Spatial Digital Twins -->
    <g transform="translate(710, 0)">
      <rect width="210" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#f472b6" stroke-opacity="0.5" stroke-width="1" />
      <text x="105" y="21" text-anchor="middle" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🏛️ Generative Architecture</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="279" rx="15.5" stroke="#38bdf8" stroke-opacity="0.2" fill="none" />
</svg>
