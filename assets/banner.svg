<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="280" fill="none" viewBox="0 0 1200 280"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0d19"/><stop offset="50%" stop-color="#0e1329"/><stop offset="100%" stop-color="#090a14"/></linearGradient><linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="pillBorder" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".6"/></linearGradient><radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c084fc" stop-opacity=".3"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></radialGradient><radialGradient id="pinkOrb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f472b6" stop-opacity=".25"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#38bdf8" stroke-opacity=".08" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatOrb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-20px) scale(1.15)}}@keyframes pulseWave{0%{opacity:.25;stroke-dashoffset:0}50%{opacity:.45;stroke-dashoffset:20}}@keyframes particleGlow{0%{opacity:.3;transform:scale(.9)}}.glow-cyan{animation:floatOrb 8s ease-in-out infinite alternate}.glow-purple{animation:floatOrb 10s ease-in-out infinite alternate-reverse}.wave-wireframe{animation:pulseWave 6s ease-in-out infinite alternate}.particl