s, Open-Source Neural Meshes &amp; Procedural Simulators</text><g><g transform="translate(140, 182) translate(0, 0)"><rect width="200" height="34" fill="#1e293b" fill-opacity=".85" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="8"/><text x="100" y="21" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🌍 Procedural Worlds</text></g><g transform="translate(140, 182) translate(230, 0)"><rect width="210" height="34" fill="#1e293b" fill-opacity=".85" stroke="#818cf8" stroke-opacity=".5" stroke-width="1" rx="8"/><text x="105" y="21" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">✨ Text &amp; Image to 3D</text></g><g transform="translate(140, 182) translate(470, 0)"><rect width="210" height="34" fill="#1e293b" fill-opacity=".85" stroke="#c084fc" stroke-opacity=".5" stroke-width="1" rx="8"/><text x="105" y="21" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🔮 3D Gaussian Splatting</text></g><g transform="translate(140, 182) translate(710, 0)"><rect width="210" height="34" fill="#1e293b" fill-opacity=".85" stroke="#f472b6" stroke-opacity=".5" stroke-width="1" rx="8"/><text x="105" y="21" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🏛️ Generative Architecture</text></g></g><rect width="1199" height="279" x=".5" y=".5" fill="none" stroke="#38bdf8" stroke-opacity=".2" rx="15.5"/></svg>